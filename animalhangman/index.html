<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Animal Hangman — Ledge & Pond</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --zen-gold:#E7C55B;
      --shell:#1876f279;
      --text:#fff;
      --muted:#b9c9d4;
      --bottom-bar-h:70px;
      --hud-h:48px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body{ height:100%; }
    body{
      margin:0; color:var(--text);
      background:linear-gradient(135deg,#1a2a6c,#b21f1f,#fdbb2d);
      font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      padding-bottom:calc(var(--bottom-bar-h) + var(--safe-bottom));
      touch-action:manipulation;
      display:flex; flex-direction:column;
      overflow:hidden; /* page itself doesn’t scroll; inner container does */
      -webkit-user-select:none; user-select:none;
    }
    /* Top bar */
    .topbar{
      position:sticky; top:0; height:60px; z-index:1000;
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      padding:0 16px; backdrop-filter:blur(8px);
      background:rgba(0,0,0,.6);
      border-bottom:1px solid rgba(255,255,255,.15);
    }
    .brand{
      font-family:'Playfair Display',serif; color:var(--zen-gold); font-weight:700;
      letter-spacing:.2px; font-size:1.3rem; text-shadow:0 2px 4px rgba(0,0,0,.5);
    }
    .link-btn{
      display:inline-flex; align-items:center; gap:6px; color:#e5e7eb; text-decoration:none;
      border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.4);
      padding:8px 14px; border-radius:12px; font-size:.9rem; font-weight:700;
    }
    /* HUD */
    .hud{
      position:sticky; top:60px; z-index:950;
      background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.15);
      border-radius:16px; padding:10px 12px; backdrop-filter:blur(6px);
      display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center;
      margin:10px 16px; box-shadow:0 4px 12px rgba(0,0,0,.3);
    }
    .hud .stat{ font-weight:800; white-space:nowrap; font-size:.9rem; display:flex; align-items:center; gap:4px; }
    .btn{
      border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.6);
      padding:10px 14px; border-radius:12px; font-weight:800; cursor:pointer;
      font-size:1rem; line-height:1; transition:.2s; color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.3);
    }
    .btn:active{ transform:translateY(2px); background:rgba(0,0,0,.8); }
    /* Main scroll area */
    .game-container{
      flex:1; display:flex; flex-direction:column; overflow:auto;
      padding:0 16px 20px; -webkit-overflow-scrolling:touch;
    }
    /* Scene */
    .scene{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:300px; margin-bottom:20px; }
    .world{
      position:relative; width:100%; max-width:520px; height:min(46dvh, 340px);
      border-radius:20px; overflow:hidden; border:2px solid rgba(255,255,255,.2);
      background:linear-gradient(180deg, rgba(8,20,26,.4), rgba(8,20,26,.6));
      box-shadow:0 8px 25px rgba(0,0,0,.4);
    }
    .sky{ position:absolute; inset:0 0 auto 0; height:40%; background:linear-gradient(to bottom, rgba(100,180,255,.3), rgba(50,120,200,.2)); }
    .hill{
      position:absolute; left:-10%; bottom:30%; width:120%; height:70%;
      border-radius:50% 50% 0 0;
      background:linear-gradient(180deg, rgba(40,140,210,.5), rgba(20,60,100,.7));
      box-shadow:inset 0 30px 60px rgba(0,0,0,.3);
    }
    .ledge{ position:absolute; left:5%; top:14%; display:flex; gap:10px; align-items:center; flex-wrap:wrap; max-width:70%; }
    .token{
      width:50px; height:50px; border-radius:50%; overflow:hidden;
      border:3px solid rgba(255,255,255,.4); box-shadow:0 4px 10px rgba(0,0,0,.5);
      background:#123; transition:transform .25s ease; flex:0 0 auto;
    }
    .token:active{ transform:scale(.97); }
    .token img{ width:100%; height:100%; object-fit:cover; display:block; }
    .pond{
      position:absolute; right:8%; bottom:10%; width:36%; height:30%;
      background:radial-gradient(60% 80% at 50% 60%, rgba(90,180,220,.7), rgba(30,110,160,.8) 60%, rgba(8,20,26,.9));
      border-radius:50%; box-shadow:inset 0 8px 20px rgba(255,255,255,.3), inset 0 -15px 30px rgba(0,0,0,.4);
      display:flex; align-items:center; justify-content:center; overflow:hidden;
    }
    .pond::after{ content:""; position:absolute; inset:10%; border-radius:50%; border:2px dashed rgba(255,255,255,.25); pointer-events:none; }
    .water-ripple{ position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.2) 0%, rgba(255,255,255,0) 70%); animation:ripple 3s infinite ease-in-out; }
    @keyframes ripple{ 0%,100%{ transform:scale(1); opacity:.5 } 50%{ transform:scale(1.1); opacity:.3 } }
    /* Word board */
    .board{ position:relative; z-index:2; display:flex; flex-direction:column; gap:14px; align-items:center; padding:12px; margin-top:10px; width:100%; max-width:520px; }
    .word{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
    .slot{
      width:40px; height:50px; display:grid; place-items:center; border-radius:12px;
      background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.2);
      font-weight:900; font-size:1.4rem; letter-spacing:.04em; text-transform:uppercase;
      transition:all .25s ease; box-shadow:0 2px 5px rgba(0,0,0,.2);
    }
    .slot.revealed{ background:rgba(231,197,91,.3); border-color:rgba(231,197,91,.7); transform:scale(1.06); box-shadow:0 4px 8px rgba(231,197,91,.4); }
    .hint-text{ color:var(--muted); font-size:1rem; text-align:center; font-weight:600; }
    /* Keypad */
    .keypad-wrap{
      position:relative; z-index:3; width:100%; max-width:520px; margin:0 auto;
      padding:12px; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.15);
      border-radius:18px; box-shadow:0 6px 15px rgba(0,0,0,.3);
    }
    .keys{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
    .key{
      min-height:48px; border-radius:12px; border:2px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.15); color:#fff; font-weight:900; font-size:1.1rem;
      cursor:pointer; transition:all .2s ease; display:flex; align-items:center; justify-content:center;
      box-shadow:0 2px 5px rgba(0,0,0,.2);
    }
    .key:active{ transform:scale(.96); background:rgba(255,255,255,.25); }
    .key[disabled]{ opacity:.55; cursor:not-allowed; transform:none; }
    .key.correct{ background:rgba(76,175,80,.4); border-color:rgba(76,175,80,.85); }
    .key.incorrect{ background:rgba(244,67,54,.4); border-color:rgba(244,67,54,.85); }
    /* Floating pieces in pond */
    .float-piece{
      position:absolute; width:45px; height:45px; border-radius:50%; overflow:hidden;
      border:2px solid rgba(255,255,255,.3); box-shadow:0 4px 10px rgba(0,0,0,.5);
      animation:bob 3s ease-in-out infinite; left:50%; top:50%; transform:translate(-50%,-50%);
    }
    .float-piece img{ width:100%; height:100%; object-fit:cover; }
    @keyframes bob{ 0%,100%{ transform:translate(-50%,-50%) translateY(0) } 50%{ transform:translate(-50%,-50%) translateY(-8px) } }
    /* FX layer for roll animation */
    .fx-layer{ position:fixed; inset:0; pointer-events:none; z-index:900; }
    .roll-clone{
      position:fixed; width:50px; height:50px; border-radius:50%; overflow:hidden;
      border:3px solid rgba(255,255,255,.4); box-shadow:0 6px 12px rgba(0,0,0,.5); will-change:transform;
    }
    .roll-clone img{ width:100%; height:100%; object-fit:cover; }
    /* Celebration modal + confetti */
    .celebration{ position:fixed; inset:0; display:flex; justify-content:center; align-items:center; background:rgba(0,0,0,.8); z-index:1100; opacity:0; pointer-events:none; transition:opacity .45s; }
    .celebration.show{ opacity:1; pointer-events:all; }
    .celebration-content{
      background:linear-gradient(135deg, rgba(255,255,255,.95), rgba(240,240,240,.98));
      padding:1.8rem; border-radius:24px; text-align:center; max-width:90%;
      box-shadow:0 20px 40px rgba(0,0,0,.5); transform:scale(.86); transition:transform .45s; border:3px solid var(--zen-gold);
    }
    .celebration.show .celebration-content{ transform:scale(1); }
    .celebration h2{ color:#E7C55B; font-family:'Playfair Display',serif; font-size:2.1rem; margin:.6rem 0 .5rem; text-shadow:0 2px 4px rgba(0,0,0,.2); }
    .celebration p{ color:#333; font-size:1.05rem; margin:.6rem 0 1.2rem; font-weight:600; }
    #confettiCanvas{ position:fixed; inset:0; width:100vw; height:100dvh; pointer-events:none; z-index:1050; }
    /* Bottom bar */
    .bottom-bar{
      position:fixed; left:0; right:0; bottom:0;
      height:calc(var(--bottom-bar-h) + var(--safe-bottom));
      padding:10px 16px calc(10px + var(--safe-bottom));
      display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:12px; align-items:center;
      z-index:1200; backdrop-filter:blur(12px); background:rgba(10,12,16,.7);
      border-top:1px solid rgba(255,255,255,.15);
    }
    .bar-btn{
      display:inline-flex; align-items:center; justify-content:center; min-height:50px;
      padding:12px 14px; border-radius:16px; border:2px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.15); color:#fff; font:600 15px/1 system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif;
      text-shadow:0 1px 2px rgba(0,0,0,.4); transition:all .2s ease; box-shadow:0 2px 6px rgba(0,0,0,.3);
    }
    .bar-btn:active{ background:rgba(255,255,255,.25); transform:scale(.98); }
    .bar-btn:disabled{ opacity:.5; pointer-events:none; }
    /* Toast */
    .toast{
      position:fixed; bottom:calc(var(--bottom-bar-h) + var(--safe-bottom) + 50px);
      left:50%; transform:translateX(-50%) translateY(20px);
      background:rgba(0,0,0,.85); color:white; padding:14px 22px; border-radius:12px;
      z-index:1300; opacity:0; transition:all .25s ease; pointer-events:none; max-width:80%; text-align:center; font-weight:600; box-shadow:0 4px 12px rgba(0,0,0,.4);
    }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
    /* Mobile tweaks */
    @media (max-width:768px){
      .keys{ grid-template-columns:repeat(6,1fr); }
      .token{ width:46px; height:46px; }
      .slot{ width:38px; height:48px; font-size:1.28rem; }
      .key{ min-height:46px; font-size:1.05rem; }
      .hud .stat{ font-size:.85rem; }
      .brand{ font-size:1.2rem; }
    }
    @media (max-width:480px){
      .keys{ grid-template-columns:repeat(5,1fr); }
      .slot{ width:36px; height:46px; font-size:1.2rem; }
      .token{ width:42px; height:42px; }
      .key{ min-height:44px; font-size:1rem; }
      .hud{ padding:8px 10px; gap:8px; }
      .hud .stat{ font-size:.8rem; }
      .world{ height:min(50dvh, 300px); }
      .celebration-content{ padding:1.4rem; }
    }
    @media (max-width:360px){
      .keys{ grid-template-columns:repeat(4,1fr); }
      .slot{ width:34px; height:44px; }
      .token{ width:40px; height:40px; }
      .ledge{ gap:8px; }
      .topbar{ padding:0 12px; }
      .game-container{ padding:0 12px 20px; }
    }
    /* Landscape */
    @media (max-height:500px) and (orientation:landscape){
      .game-container{ flex-direction:row; align-items:center; }
      .scene{ flex:2; margin:0 14px 0 0; }
      .keypad-wrap{ flex:1; margin:0; max-width:320px; }
      .world{ height:min(42dvh, 260px); }
      .hill{ bottom:20%; }
      .ledge{ top:10%; }
      .pond{ bottom:14%; }
      .board{ margin-top:0; }
    }
    /* Reduced motion */
    @media (prefers-reduced-motion:reduce){
      *{ transition:none !important; animation:none !important; }
    }
    /* Focus rings */
    :focus-visible{ outline:2px solid rgba(231,197,91,.85); outline-offset:3px; border-radius:10px; }
    .key:focus-visible,.bar-btn:focus-visible,.btn:focus-visible{ outline:2px solid rgba(231,197,91,.85); outline-offset:3px; border-radius:10px; }
  </style>
<link rel="stylesheet" href="/guide-theme.css">

<body class="theme-game">
  <!-- Top bar -->
  <div class="topbar">
    <div class="brand">Animal Hangman</div>
    <div class="top-actions">
      <a href="/" class="link-btn">🏠 Home</a>
    </div>
  </div>

  <!-- HUD -->
  <div class="hud" id="hud">
    <span class="stat">🔄 Word: <span id="category">Animals</span></span>
    <span class="stat">❤️ Lives: <span id="lives">0</span></span>
    <span class="stat">💡 Hints: <span id="hints">3</span></span>
    <span class="stat" id="status">Tap letters below</span>
    <button id="muteBtn" class="btn" type="button" aria-label="Mute">🔊</button>
  </div>

  <canvas id="confettiCanvas" width="1" height="1"></canvas>
  <div class="fx-layer" id="fxLayer"></div>

  <!-- Toast -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- Celebration -->
  <div id="celebration" class="celebration" aria-hidden="true">
    <div class="celebration-content">
      <h2 id="celebrationTitle">Awesome!</h2>
      <p id="celebrationMessage">You solved the word!</p>
      <button id="playAgainBtn" class="btn" style="background:#E7C55B;color:#000;padding:12px 24px;font-size:1.1rem;font-weight:800;">Play Again!</button>
    </div>
  </div>

  <!-- Main game -->
  <div class="game-container" id="container">
    <div class="scene">
      <div class="world" id="world">
        <div class="sky"></div>
        <div class="hill"></div>
        <div class="ledge" id="ledge"></div>
        <div class="pond" id="pond">
          <div class="water-ripple"></div>
        </div>
        <div class="board">
          <div class="hint-text">Guess the animal name</div>
          <div class="word" id="word"></div>
        </div>
      </div>
    </div>

    <!-- Keypad -->
    <div class="keypad-wrap" aria-label="Letters">
      <div class="keys" id="keys"></div>
    </div>
  </div>

  <!-- Bottom bar -->
  <nav class="bottom-bar" id="bottomBar" role="toolbar" aria-label="Primary actions">
    <button id="newWordBtn" class="bar-btn" type="button">🔁 New Word</button>
    <button id="hintBtn" class="bar-btn" type="button">💡 Hint (3)</button>
    <button id="resetBtn" class="bar-btn" type="button">↺ Reset</button>
  </nav>

<script>
/* ---------- Data ---------- */
const ANIMALS = [
  { name:"Lion", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/002_The_lion_king_Snyggve_in_the_Serengeti_National_Park_Photo_by_Giles_Laurent.jpg/640px-002_The_lion_king_Snyggve_in_the_Serengeti_National_Park_Photo_by_Giles_Laurent.jpg" },
  { name:"Elephant", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Sitting_Asian_elephant_%28Elephas_maximus%29_bathing_in_Tad_Lo_river%2C_Laos.jpg/640px-Sitting_Asian_elephant_%28Elephas_maximus%29_bathing_in_Tad_Lo_river%2C_Laos.jpg" },
  { name:"Giraffe", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/042_Masai_giraffe_in_the_Serengeti_National_Park_Photo_by_Giles_Laurent.jpg/640px-042_Masai_giraffe_in_the_Serengeti_National_Park_Photo_by_Giles_Laurent.jpg" },
  { name:"Panda", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Grosser_Panda.JPG/640px-Grosser_Panda.JPG" },
  { name:"Koala", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/Koala_at_the_Lone_Pine_Koala_Sanctuary%2C_Brisbane%2C_April_20_1014._%2814491807821%29.jpg/640px-Koala_at_the_Lone_Pine_Koala_Sanctuary%2C_Brisbane%2C_April_20_1014._%2814491807821%29.jpg" },
  { name:"Penguin", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/Adelie_Penguins_on_iceberg.jpg/640px-Adelie_Penguins_on_iceberg.jpg" },
  { name:"Dolphin", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/Captive_dolphins_perform_tricks_for_human_tourists.jpg/640px-Captive_dolphins_perform_tricks_for_human_tourists.jpg" },
  { name:"Tiger", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Bengal_tiger_%28Panthera_tigris_tigris%29_female_2.jpg/640px-Bengal_tiger_%28Panthera_tigris_tigris%29_female_2.jpg" },
  { name:"Zebra", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Burchell%27s_zebra_%28Equus_quagga_burchellii%29_2.jpg/640px-Burchell%27s_zebra_%28Equus_quagga_burchellii%29_2.jpg" },
  { name:"Otter", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Sea-otter-morro-bay_13.jpg/640px-Sea-otter-morro-bay_13.jpg" },
  { name:"Rhino", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Indian_rhinoceros_%28Rhinoceros_unicornis%29_6.jpg/640px-Indian_rhinoceros_%28Rhinoceros_unicornis%29_6.jpg" },
  { name:"Hippo", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Hipop%C3%B3tamo_%28Hippopotamus_amphibius%29%2C_parque_nacional_de_Chobe%2C_Botsuana%2C_2018-07-28%2C_DD_82.jpg/640px-Hipop%C3%B3tamo_%28Hippopotamus_amphibius%29%2C_parque_nacional_de_Chobe%2C_Botsuana%2C_2018-07-28%2C_DD_82.jpg" },
  { name:"Moose", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d6/Alces_alces_Wildpark_Alte_Fasanerie_Klein-Auheim_Juni_2012.JPG/640px-Alces_alces_Wildpark_Alte_Fasanerie_Klein-Auheim_Juni_2012.JPG" },
  { name:"Rabbit", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Bunny_rabbit_at_Alligator_Bay%2C_Beauvoir%2C_France.jpg/640px-Bunny_rabbit_at_Alligator_Bay%2C_Beauvoir%2C_France.jpg" },
  { name:"Turtle", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Chelonia_mydas_is_going_for_the_air_edit.jpg/640px-Chelonia_mydas_is_going_for_the_air_edit.jpg" },
  { name:"Eagle", url:"https://upload.wikimedia.org/wikipedia/commons/1/1a/Bald_Eagle_Portrait.jpg" },
  { name:"Parrot", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Ara_ararauna_Luc_Viatour.jpg/640px-Ara_ararauna_Luc_Viatour.jpg" },
  { name:"Shark", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/31/Great_white_shark_south_africa.jpg/640px-Great_white_shark_south_africa.jpg" },
  { name:"Llama", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Lama_glama_Laguna_Colorada_2.jpg/640px-Lama_glama_Laguna_Colorada_2.jpg" },
  { name:"Fox", url:"https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Vulpes_vulpes_laying_in_snow.jpg/640px-Vulpes_vulpes_laying_in_snow.jpg" }
];
const WORDS = [
  'LION','ELEPHANT','GIRAFFE','PANDA','KOALA','PENGUIN','DOLPHIN','TIGER','ZEBRA','OTTER','RHINO','HIPPO','MOOSE','RABBIT','TURTLE','EAGLE','PARROT','SHARK','LLAMA','FOX','WOLF','BEAVER','PUMA','HYENA','LEOPARD','CAMEL','BUFFALO','GORILLA','JAGUAR','MONKEY','WHALE','OCTOPUS','SEAHORSE','CHEETAH','FLAMINGO','PELICAN'
];

/* ---------- State ---------- */
const LIVES = 6;
let state = { word:'', revealed:[], guessed:new Set(), lives:LIVES, hints:3, muted:false, over:false };

/* ---------- Elements ---------- */
const wordEl = document.getElementById('word');
const ledgeEl = document.getElementById('ledge');
const pondEl = document.getElementById('pond');
const keysEl = document.getElementById('keys');
const statusEl = document.getElementById('status');
const livesEl = document.getElementById('lives');
const hintsEl = document.getElementById('hints');
const hintBtn = document.getElementById('hintBtn');
const newWordBtn = document.getElementById('newWordBtn');
const resetBtn = document.getElementById('resetBtn');
const muteBtn = document.getElementById('muteBtn');
const fxLayer = document.getElementById('fxLayer');
const celebration = document.getElementById('celebration');
const celebrationTitle = document.getElementById('celebrationTitle');
const celebrationMessage = document.getElementById('celebrationMessage');
const playAgainBtn = document.getElementById('playAgainBtn');
const confettiCanvas = document.getElementById('confettiCanvas');
const toastEl = document.getElementById('toast');

/* ---------- Toast ---------- */
function showToast(msg, ms=2000){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=> toastEl.classList.remove('show'), ms);
}

/* ---------- Audio (mobile-safe) ---------- */
let ACtx=null, audioPrimed=false;
function ensureAudioCtx(){ if(!ACtx) ACtx = new (window.AudioContext||window.webkitAudioContext)(); if(ACtx.state==='suspended') ACtx.resume?.(); }
function primeAudioOnce(){
  if(audioPrimed) return; ensureAudioCtx();
  try{
    const o=ACtx.createOscillator(), g=ACtx.createGain();
    o.frequency.value=880; g.gain.value=0.02; o.connect(g).connect(ACtx.destination); o.start(); setTimeout(()=>o.stop(),120);
  }catch{}
  audioPrimed=true;
}
function tone(f=880, ms=120, g=0.03){
  if(state.muted) return; ensureAudioCtx();
  const o=ACtx.createOscillator(), a=ACtx.createGain();
  o.type='sine'; o.frequency.value=f; a.gain.value=g; o.connect(a).connect(ACtx.destination); o.start(); setTimeout(()=>o.stop(),ms);
}
function updateMuteUI(){ muteBtn.textContent = state.muted ? '🔇' : '🔊'; }

/* ---------- Confetti (dvh-aware) ---------- */
let cctx, bursts=[];
function sizeCanvas(){
  confettiCanvas.width = Math.ceil(window.innerWidth);
  confettiCanvas.height = Math.ceil(window.innerHeight);
  cctx = confettiCanvas.getContext('2d');
}
sizeCanvas();
addEventListener('resize', sizeCanvas, {passive:true});

function burst(x,y, colors=['#E7C55B','#FFD166','#FF9E6D']){
  const N=80, parts=[];
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2, s=2+Math.random()*4;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,g:0.08+Math.random()*0.06,life:60+(Math.random()*20|0),color:colors[i%colors.length],size:2+Math.random()*3,rot:Math.random()*Math.PI,vr:(Math.random()-.5)*0.2});
  }
  bursts.push(parts);
  if(bursts.length===1) requestAnimationFrame(tick);
}
function tick(){
  if(!cctx){ requestAnimationFrame(tick); return; }
  cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
  bursts = bursts.filter(parts=>{
    for(const p of parts){
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot);
      cctx.fillStyle=p.color; cctx.globalAlpha=Math.max(0, p.life/80);
      cctx.fillRect(-p.size/2, -p.size/2, p.size, p.size); cctx.restore();
    }
    return parts.some(p=>p.life>0);
  });
  if(bursts.length) requestAnimationFrame(tick);
}
function celebrateWin(){
  celebrationTitle.textContent='Awesome!';
  celebrationMessage.textContent=`You solved "${state.word}"`;
  celebration.classList.add('show');
  const r = celebration.querySelector('.celebration-content').getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/2);
  if(!state.muted){
    tone(880,180,0.05); setTimeout(()=>tone(1100,200,0.05),200);
    setTimeout(()=>tone(1320,300,0.05),400); setTimeout(()=>tone(1600,380,0.05),600);
  }
}

/* ---------- Scene: ledge & roll ---------- */
let ledgeTokens=[];
function setupLedge(){
  ledgeEl.innerHTML=''; ledgeTokens=[];
  const picks = shuffle(ANIMALS).slice(0, LIVES);
  for(const a of picks){
    const t=document.createElement('div'); t.className='token';
    const img=document.createElement('img'); img.src=a.url; img.alt=a.name; img.decoding='async'; img.loading='lazy'; img.draggable=false;
    t.appendChild(img); ledgeEl.appendChild(t);
    ledgeTokens.push({el:t,data:a});
  }
}
function rollOneToPond(){
  if(!ledgeTokens.length) return;
  const {el,data}=ledgeTokens.shift();
  const sr=el.getBoundingClientRect();
  const sx=sr.left + sr.width/2, sy=sr.top + sr.height/2;
  const pr=pondEl.getBoundingClientRect();
  const px=pr.left + pr.width*(0.25 + Math.random()*0.5);
  const py=pr.top + pr.height*(0.45 + Math.random()*0.15);

  const clone=el.cloneNode(true); clone.classList.add('roll-clone'); fxLayer.appendChild(clone);
  const cr=clone.getBoundingClientRect(); let t0=null;
  const D=900 + Math.random()*250; const rotBase=(Math.random()<.5?1:-1)*(Math.PI*3);

  const mx=(sx+px)/2 + (Math.random()<.5?-80:80);
  const my=Math.min(sy,py) - 120;
  function path(p){
    const qx=(1-p)*(1-p)*sx + 2*(1-p)*p*mx + p*p*px;
    const qy=(1-p)*(1-p)*sy + 2*(1-p)*p*my + p*p*py;
    return [qx,qy];
  }
  function step(ts){
    if(!t0) t0=ts; const u=Math.min(1, (ts-t0)/D);
    const [qx,qy]=path(u); const angle=rotBase*u*2;
    clone.style.transform=`translate(${qx-cr.width/2}px, ${qy-cr.height/2}px) rotate(${angle}rad)`;
    if(u<1) requestAnimationFrame(step);
    else{
      clone.remove();
      const fp=document.createElement('div'); fp.className='float-piece';
      // place relative to pond
      fp.style.left = ((px - pr.left)/pr.width*100) + '%';
      fp.style.top  = ((py - pr.top)/pr.height*100) + '%';
      const img=document.createElement('img'); img.src=data.url; img.alt=data.name; img.decoding='async'; img.loading='lazy'; img.draggable=false;
      fp.appendChild(img); pondEl.appendChild(fp);
    }
  }
  requestAnimationFrame(step);
}

/* ---------- Game ---------- */
const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
function newWord(){
  state.word = WORDS[(Math.random()*WORDS.length)|0];
  state.revealed = state.word.split('').map(ch => (ch==='-'||ch===' ')? ch : null);
  state.guessed = new Set(); state.lives=LIVES; state.hints=3; state.over=false;
  renderWord(); renderKeys(); updateHUD(); setupLedge();
  // Clear only floating pieces; keep ripple alive
  [...pondEl.querySelectorAll('.float-piece')].forEach(n=>n.remove());
  if(!pondEl.querySelector('.water-ripple')){
    const r=document.createElement('div'); r.className='water-ripple'; pondEl.appendChild(r);
  }
  statusEl.textContent='Tap letters below';
  showToast('New word loaded!');
}
function renderWord(){
  wordEl.innerHTML='';
  for(let i=0;i<state.word.length;i++){
    const ch=state.word[i]; const slot=document.createElement('div'); slot.className='slot';
    if(state.revealed[i]){ slot.textContent=ch; slot.classList.add('revealed'); }
    else if(ch===' '||ch==='-'){ slot.textContent=ch; }
    wordEl.appendChild(slot);
  }
}
function renderKeys(){
  keysEl.innerHTML='';
  ABC.forEach(letter=>{
    const b=document.createElement('button'); b.className='key'; b.type='button'; b.textContent=letter;
    b.disabled = state.guessed.has(letter) || state.over;
    if(state.guessed.has(letter)){
      if(state.word.includes(letter)) b.classList.add('correct');
      else b.classList.add('incorrect');
    }
    b.addEventListener('click', ()=>guess(letter), {passive:true});
    keysEl.appendChild(b);
  });
}
function guess(letter){
  if(state.over || state.guessed.has(letter)) return;
  state.guessed.add(letter);
  const idxs=[]; for(let i=0;i<state.word.length;i++){ if(state.word[i]===letter) idxs.push(i); }
  if(idxs.length){
    idxs.forEach(i=> state.revealed[i]=letter);
    tone(880,120,0.03); statusEl.textContent="Nice!"; showToast('Correct!', 900);
    renderWord(); renderKeys();
    const solved = state.revealed.every((v,i)=> (state.word[i]===' '||state.word[i]==='-') ? true : !!v);
    if(solved){ state.over=true; statusEl.textContent='You win!'; setTimeout(celebrateWin,220); }
  }else{
    tone(300,120,0.03); state.lives = Math.max(0, state.lives-1); rollOneToPond();
    statusEl.textContent='Try again…'; showToast('Wrong guess!', 900);
    renderKeys(); updateHUD();
    if(state.lives===0){
      state.over=true; statusEl.textContent=`Out of animals! It was ${state.word}.`;
      setTimeout(()=>{ celebrationTitle.textContent='Game Over'; celebrationMessage.textContent=`The word was "${state.word}".`; celebration.classList.add('show'); }, 450);
    }
  }
  updateHUD();
}
function useHint(){
  if(state.over) return;
  if(state.hints<=0){ hintBtn.disabled=true; showToast('No hints left!', 1400); return; }
  const hiddenIdx=[]; for(let i=0;i<state.word.length;i++){ const ch=state.word[i]; if(/[A-Z]/.test(ch) && !state.revealed[i]) hiddenIdx.push(i); }
  if(!hiddenIdx.length){ hintBtn.disabled=true; return; }
  const pick = hiddenIdx[(Math.random()*hiddenIdx.length)|0];
  const letter = state.word[pick]; state.hints--; hintBtn.textContent=`💡 Hint (${state.hints})`; hintsEl.textContent=state.hints;
  showToast(`Hint: The word contains "${letter}"`, 1600);
  if(!state.guessed.has(letter)) guess(letter);
}
function updateHUD(){
  livesEl.textContent=state.lives; hintsEl.textContent=state.hints;
  hintBtn.disabled = state.hints<=0 || state.over;
  hintBtn.textContent = `💡 Hint (${state.hints})`;
}
/* ---------- Utils ---------- */
function shuffle(a){ return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]); }

/* ---------- Controls ---------- */
newWordBtn.addEventListener('click', ()=>{ newWord(); if(!state.muted) tone(520,120,0.03); }, {passive:true});
hintBtn.addEventListener('click', ()=>{ useHint(); if(!state.muted) tone(1000,100,0.025); }, {passive:true});
resetBtn.addEventListener('click', ()=>{ newWord(); if(!state.muted) tone(440,120,0.03); }, {passive:true});
muteBtn.addEventListener('click', ()=>{
  ensureAudioCtx(); if(ACtx?.state==='suspended') ACtx.resume?.();
  state.muted=!state.muted; localStorage.setItem('hang_mute', state.muted?'1':'0'); updateMuteUI(); if(!state.muted) tone(880,100,0.03);
});

/* Celebration button */
playAgainBtn.addEventListener('click', ()=>{ celebration.classList.remove('show'); newWord(); }, {passive:true});

/* ---------- Keyboard (desktop) ---------- */
document.addEventListener('keydown', (e)=>{
  if(state.over) return;
  const key=e.key?.toUpperCase?.(); if(key && ABC.includes(key) && !state.guessed.has(key)) guess(key);
});

/* ---------- Swipes (mobile) ---------- */
let touchStartX=0, touchStartY=0;
document.addEventListener('touchstart', (e)=>{ const t=e.changedTouches[0]; touchStartX=t.screenX; touchStartY=t.screenY; }, {passive:true});
document.addEventListener('touchend', (e)=>{
  if(state.over) return;
  const t=e.changedTouches[0]; const dx=touchStartX - t.screenX; const dy=touchStartY - t.screenY;
  if(Math.abs(dx)>64 && Math.abs(dy)<56){
    if(dx>0){ newWord(); if(!state.muted) tone(520,120,0.03); }
    else{ useHint(); if(!state.muted) tone(1000,100,0.025); }
  }
}, {passive:true});

/* ---------- Init ---------- */
function init(){
  state.muted = (localStorage.getItem('hang_mute') ?? '0') === '1';
  updateMuteUI();
  renderKeys(); newWord();
  const prime=()=>{ primeAudioOnce(); removeEventListener('pointerdown',prime); removeEventListener('keydown',prime); };
  addEventListener('pointerdown', prime, {passive:true});
  addEventListener('keydown', prime);
}
init();
</script>
</body>
